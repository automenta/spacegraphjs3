<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpaceGraphJS Demo</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
      }
      #container {
        width: 100%;
        height: 100%;
      }

      .ui-panel {
        position: absolute;
        top: 20px;
        left: 20px;
        width: 300px;
        background-color: rgba(20, 20, 20, 0.8);
        border: 1px solid #444;
        border-radius: 8px;
        color: #eee;
        font-family: sans-serif;
        padding: 15px;
        z-index: 100;
        max-height: calc(100vh - 40px);
        overflow-y: auto;
      }
      .ui-panel h2 {
        margin-top: 0;
        font-size: 1.2em;
        border-bottom: 1px solid #444;
        padding-bottom: 10px;
        margin-bottom: 10px;
      }
      .ui-panel .section {
        margin-bottom: 15px;
      }
      .ui-panel .section h3 {
        font-size: 1em;
        color: #aaa;
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .ui-panel button {
        display: block;
        width: 100%;
        padding: 10px;
        margin-bottom: 5px;
        background-color: #333;
        border: 1px solid #555;
        color: #eee;
        text-align: left;
        border-radius: 4px;
        cursor: pointer;
        transition: background-color 0.2s;
      }
      .ui-panel button:hover {
        background-color: #444;
      }
      .ui-panel button.active {
        background-color: #48dbfb;
        color: #000;
        font-weight: bold;
        border-color: #48dbfb;
      }
    </style>
  </head>
  <body>
    <div id="container"></div>
    <div class="ui-panel" id="ui-panel">
      <h2>SpaceGraphJS Demo</h2>
      <div class="section">
        <h3>Graph Demos</h3>
        <button class="active" id="btn-full-demo">Full Demo</button>
        <button id="btn-camera-controls">Advanced Camera Controls</button>
        <button id="btn-layout-systems">Advanced Layout Systems</button>
        <button id="btn-edge-features">Comprehensive Edge Features</button>
      </div>
      <div class="section">
        <h3>Camera Actions</h3>
        <button id="btn-frame-all">Frame All Nodes</button>
        <button id="btn-fly-to-html">Fly to HTML Node</button>
      </div>
    </div>
    <script type="module" src="/examples/demo.ts"></script>
  </body>
</html>
