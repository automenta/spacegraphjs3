<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>SpaceGraphJS - Visual Showcase</title>
  <style>
      body {
          font-family: Arial, sans-serif;
          margin: 0;
          padding: 20px;
          background-color: #f5f5f5;
      }

      h1 {
          text-align: center;
          color: #333;
      }

      .gallery {
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
          gap: 20px;
          margin-top: 20px;
      }

      .screenshot {
          background: white;
          border-radius: 8px;
          overflow: hidden;
          box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      .screenshot img {
          width: 100%;
          height: auto;
          display: block;
      }

      .caption {
          padding: 15px;
          text-align: center;
          font-weight: bold;
          color: #555;
      }
  </style>
</head>
<body>
<h1>SpaceGraphJS Visual Showcase</h1>

<div class="gallery">
  <div class="screenshot">
    <img alt="Comprehensive Demo" src="comprehensive-demo.png">
    <div class="caption">Comprehensive Demo - All Features</div>
  </div>

  <div class="screenshot">
    <img alt="Element Actors" src="element-actors-demo.png">
    <div class="caption">Element Actors - Sphere, Box, Text, Custom</div>
  </div>

  <div class="screenshot">
    <img alt="Edge Interaction" src="edge-interaction-demo.png">
    <div class="caption">Edge Interaction - Hover, Click, Selection</div>
  </div>

  <div class="screenshot">
    <img alt="Layout Engines" src="layout-engines-demo.png">
    <div class="caption">Layout Engines - Force-directed, Grid, Circle</div>
  </div>

  <div class="screenshot">
    <img alt="Close-up View" src="comprehensive-demo-closeup.png">
    <div class="caption">Close-up View of Graph Elements</div>
  </div>

  <div class="screenshot">
    <img alt="Visible Rendering Demo" src="visible-rendering-demo.png">
    <div class="caption">Visible Rendering Demo - All Element Types Without Labels</div>
  </div>
</div>
</body>
</html>
