<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceGraphJS - Visual Showcase</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .screenshot {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .screenshot img {
            width: 100%;
            height: auto;
            display: block;
        }
        .caption {
            padding: 15px;
            text-align: center;
            font-weight: bold;
            color: #555;
        }
    </style>
</head>
<body>
    <h1>SpaceGraphJS Visual Showcase</h1>
    
    <div class="gallery">
        <div class="screenshot">
            <img src="comprehensive-demo.png" alt="Comprehensive Demo">
            <div class="caption">Comprehensive Demo - All Features</div>
        </div>
        
        <div class="screenshot">
            <img src="element-actors-demo.png" alt="Element Actors">
            <div class="caption">Element Actors - Sphere, Box, Text, Custom</div>
        </div>
        
        <div class="screenshot">
            <img src="edge-interaction-demo.png" alt="Edge Interaction">
            <div class="caption">Edge Interaction - Hover, Click, Selection</div>
        </div>
        
        <div class="screenshot">
            <img src="layout-engines-demo.png" alt="Layout Engines">
            <div class="caption">Layout Engines - Force-directed, Grid, Circle</div>
        </div>
        
        <div class="screenshot">
            <img src="comprehensive-demo-closeup.png" alt="Close-up View">
            <div class="caption">Close-up View of Graph Elements</div>
        </div>
    </div>
</body>
</html>
