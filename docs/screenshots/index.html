<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>SpaceGraphJS - Visual Documentation</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        padding: 20px;
        background: #1e1e1e;
        color: #ffffff;
      }

      h1 {
        text-align: center;
        color: #007acc;
        margin-bottom: 30px;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(450px, 1fr));
        gap: 20px;
        margin-top: 20px;
      }

      .screenshot-group {
        background: #2d2d2d;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      }

      .screenshot {
        position: relative;
        background: #1a1a1a;
        padding: 15px;
        border-bottom: 1px solid #333;
      }

      .screenshot img {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 4px;
        transition: transform 0.2s;
      }

      .screenshot img:hover {
        transform: scale(1.02);
      }

      .caption {
        padding: 15px;
        text-align: center;
        font-weight: 500;
        color: #cccccc;
      }

      .caption h3 {
        margin: 0 0 5px 0;
        color: #007acc;
      }

      .caption p {
        margin: 0;
        font-size: 14px;
        color: #999;
      }

      .no-screenshots {
        text-align: center;
        padding: 50px;
        color: #666;
        font-style: italic;
      }

      .regenerate-btn {
        display: block;
        margin: 0 auto 30px auto;
        padding: 12px 24px;
        background: #007acc;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
        transition: background 0.2s;
      }

      .regenerate-btn:hover {
        background: #005aa3;
      }
    </style>
  </head>
  <body>
    <h1>SpaceGraphJS Visual Documentation</h1>

    <button class="regenerate-btn" onclick="regenerateScreenshots()">
      🔄 Regenerate Screenshots
    </button>

    <div class="gallery" id="gallery">
      <div class="no-screenshots">
        No screenshots found. Click "Regenerate Screenshots" to generate them.
      </div>
    </div>

    <script>
      async function loadScreenshots() {
        try {
          const response = await fetch('./screenshots.json');
          if (!response.ok) {
            throw new Error('Screenshots manifest not found');
          }

          const screenshots = await response.json();
          renderGallery(screenshots);
        } catch (error) {
          console.log('No screenshots manifest found, will show regenerate option');
        }
      }

      function renderGallery(screenshots) {
        const gallery = document.getElementById('gallery');

        if (!screenshots || screenshots.length === 0) {
          gallery.innerHTML = '<div class="no-screenshots">No screenshots available. Run the screenshot generator to create them.</div>';
          return;
        }

        // Group screenshots by base name
        const groups = {};
        screenshots.forEach(screenshot => {
          const baseName = screenshot.name.replace(/(-hover|-selected)$/, '');
          if (!groups[baseName]) {
            groups[baseName] = [];
          }
          groups[baseName].push(screenshot);
        });

        gallery.innerHTML = Object.entries(groups).map(([baseName, groupScreenshots]) => {
          const primaryScreenshot = groupScreenshots.find(s => !s.name.includes('-hover') && !s.name.includes('-selected')) || groupScreenshots[0];
          const hoverScreenshot = groupScreenshots.find(s => s.name.includes('-hover'));
          const selectedScreenshot = groupScreenshots.find(s => s.name.includes('-selected'));

          return `
            <div class="screenshot-group">
              <div class="screenshot">
                <img src="${primaryScreenshot.path}" alt="${primaryScreenshot.description}" />
              </div>
              <div class="caption">
                <h3>${primaryScreenshot.title}</h3>
                <p>${primaryScreenshot.description}</p>
                ${hoverScreenshot ? `<p><small>Hover state available</small></p>` : ''}
                ${selectedScreenshot ? `<p><small>Selection state available</small></p>` : ''}
              </div>
            </div>
          `;
        }).join('');
      }

      async function regenerateScreenshots() {
        const btn = document.querySelector('.regenerate-btn');
        const originalText = btn.textContent;
        btn.textContent = '🔄 Generating...';
        btn.disabled = true;

        try {
          // This would need to be implemented as a server endpoint or manual process
          alert('Screenshot generation requires running the development server and executing the generate script manually.\n\nRun: npm run generate-screenshots');
        } catch (error) {
          alert('Error regenerating screenshots: ' + error.message);
        } finally {
          btn.textContent = originalText;
          btn.disabled = false;
        }
      }

      // Load screenshots on page load
      loadScreenshots();
    </script>
  </body>
</html>
