<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpaceGraphJS Playground</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #1e1e1e;
        color: #ffffff;
        height: 100vh;
        overflow: hidden;
      }

      .playground-container {
        display: flex;
        height: 100vh;
      }

      .editor-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
        border-right: 1px solid #333;
      }

      .toolbar {
        padding: 8px;
        background: #2d2d2d;
        border-bottom: 1px solid #333;
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .toolbar button {
        padding: 6px 12px;
        background: #007acc;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
      }

      .toolbar button:hover {
        background: #005aa3;
      }

      .toolbar select {
        padding: 6px;
        background: #3c3c3c;
        color: white;
        border: 1px solid #555;
        border-radius: 4px;
      }

      .editor-container {
        flex: 1;
        position: relative;
      }

      .preview-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .preview-toolbar {
        padding: 8px;
        background: #2d2d2d;
        border-bottom: 1px solid #333;
        font-size: 14px;
      }

      .preview-container {
        flex: 1;
        position: relative;
      }

      #graph-container {
        width: 100%;
        height: 100%;
      }

      @media (max-width: 768px) {
        .playground-container {
          flex-direction: column;
        }

        .editor-panel {
          border-right: none;
          border-bottom: 1px solid #333;
          height: 50vh;
        }

        .preview-panel {
          height: 50vh;
        }
        .tutorial-modal {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: rgba(0, 0, 0, 0.8);
          display: flex;
          align-items: center;
          justify-content: center;
          z-index: 1000;
        }

        .tutorial-content {
          background: #2d2d2d;
          color: white;
          padding: 30px;
          border-radius: 8px;
          max-width: 500px;
          text-align: center;
        }

        .tutorial-content h2 {
          margin-top: 0;
          color: #007acc;
        }

        .tutorial-buttons {
          display: flex;
          gap: 10px;
          justify-content: center;
          margin-top: 20px;
        }

        .tutorial-highlight {
          background: rgba(0, 122, 204, 0.2);
          border: 2px solid #007acc;
          animation: pulse 2s infinite;
        }

        @keyframes pulse {
          0% {
            box-shadow: 0 0 0 0 rgba(0, 122, 204, 0.4);
          }
          70% {
            box-shadow: 0 0 0 10px rgba(0, 122, 204, 0);
          }
          100% {
            box-shadow: 0 0 0 0 rgba(0, 122, 204, 0);
          }
        }
      }
    </style>
  </head>
  <body>
    <div class="playground-container">
      <div class="editor-panel">
        <div class="toolbar">
          <select id="template-select">
            <option value="basic">Basic Graph</option>
            <option value="large">Large Graph</option>
            <option value="interactive">Interactive Edges</option>
          </select>
          <button id="run-btn">Run</button>
          <button id="import-btn">Import Data</button>
          <button id="share-btn">Share</button>
          <button id="tutorial-btn">Tutorial</button>
        </div>
        <div class="editor-container" id="editor-container"></div>
      </div>
      <div class="preview-panel">
        <div class="preview-toolbar">Live Preview</div>
        <div class="preview-container">
          <div id="graph-container"></div>
        </div>
      </div>
    </div>

    <input
      type="file"
      id="file-input"
      accept=".json,.csv"
      style="display: none"
    />

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
