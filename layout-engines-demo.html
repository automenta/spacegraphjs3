<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>SpaceGraphJS - Layout Engines Demo</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
        font-family: Arial, sans-serif;
      }

      #container {
        width: 100%;
        height: 100%;
      }

      #controls {
        position: absolute;
        top: 10px;
        left: 10px;
        z-index: 1000;
        color: white;
        background-color: rgba(0, 0, 0, 0.7);
        padding: 10px;
        border-radius: 5px;
      }

      #controls button {
        margin: 5px;
        padding: 5px 10px;
        background-color: #333;
        color: white;
        border: none;
        border-radius: 3px;
        cursor: pointer;
      }

      #controls button:hover {
        background-color: #555;
      }

      #controls button.active {
        background-color: #007acc;
      }
    </style>
  </head>
  <body>
    <div id="container"></div>
    <div id="controls">
      <h3>Layout Engines Demo</h3>
      <button id="forceBtn" class="active">Force Directed</button>
      <button id="gridBtn">Grid</button>
      <button id="circleBtn">Circle</button>
      <button id="columnBtn">Column</button>
      <button id="rowBtn">Row</button>
      <button id="randomBtn">Random</button>
      <p>Current Layout: <span id="currentLayout">Force Directed</span></p>
      <p><a href="basic-renderer-test.html" style="color: #4CAF50;">Try Basic Renderer Test</a></p>
      <p><a href="comprehensive-basic-renderer-test.html" style="color: #4CAF50;">Try Comprehensive Basic Renderer Test</a></p>
      <p><a href="visible-rendering-demo.html" style="color: #4CAF50;">Try Visible Rendering Demo</a></p>
    </div>
    <script src="/examples/layout-engines-demo.ts" type="module"></script>
  </body>
</html>
